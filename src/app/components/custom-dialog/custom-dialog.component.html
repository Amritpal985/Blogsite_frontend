<div class="dialog-head">
  <span class="dialog-icon"><mat-icon>error_outline</mat-icon></span>
  <h2 mat-dialog-title>{{ data.title }}</h2>
</div>
<mat-dialog-content>{{ data.message }}</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button class="btn-stay" mat-dialog-close (click)="close(false)">No</button>
  <button mat-button class="btn-leave" mat-dialog-close (click)="close(true)">Yes</button>
</mat-dialog-actions>
